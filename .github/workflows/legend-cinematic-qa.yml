name: Legend Ball 3-scene cinematic upgrade QA
on:
  push:
    branches: [feat/cinematic-energy-scenes-20261113]
    paths:
      - '.github/workflows/legend-cinematic-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cinematic-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check play/legend/cinematics.js
          node --check play/legend/default-project.js
          node --check play/reels.js
          node --check play/game.js
          node --check scripts/tests/cinematic-mobile-browser.mjs
      - name: Verify unchanged Skygate engine, three WebPs and Studio parity
        run: |
          npm test
          node --test scripts/tests/legend-brand.test.mjs
          node --test scripts/tests/cinematic-vfx.test.mjs
      - name: Prepare independent game assets
        run: node scripts/prepare-play.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Boot isolated local game
        shell: bash
        run: |
          set -euo pipefail
          PORT=3107 NODE_ENV=development node server.mjs > /tmp/cinematic-qa-server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3107/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cinematic-qa-server.log
          exit 1
      - name: Test 320/390/430/1440px scene transitions, Spin and screenshots
        run: node scripts/tests/cinematic-mobile-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legend-cinematic-mobile-screenshots
          path: qa-artifacts/cinematic-v3/
          if-no-files-found: ignore
          retention-days: 14
