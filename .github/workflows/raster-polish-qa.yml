name: PNG scene final viewport regression
on:
  push:
    branches: [fix/raster-artwork-20261112]
    paths: [.github/workflows/raster-polish-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1665a8f668028b6744e4e8ae08282d347c8e5d20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve source gameplay and check PNG integrity
        run: |
          npm test
          node --test scripts/tests/legend-brand.test.mjs
      - name: Prepare verification browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Local HTTP mobile, Studio and footer regression
        shell: bash
        run: |
          set -euo pipefail
          PORT=3107 NODE_ENV=development node server.mjs >/tmp/legend-polish-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3107/health >/dev/null; then break; fi
            sleep .2
          done
          TEST_STUDIO=1 node scripts/tests/raster-mobile-browser.mjs
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const b=await chromium.launch({headless:true,args:['--no-sandbox']});
          try {
            for(const [width,height] of [[320,568],[390,844],[430,932],[1440,1000]]) {
              const p=await b.newPage({viewport:{width,height},reducedMotion:'reduce'});
              await p.goto('http://127.0.0.1:3107/play/');
              await p.waitForFunction(()=>!document.getElementById('bootPlay').disabled);
              await p.locator('#bootPlay').click();
              const r=await p.evaluate(()=>{
                const brand=document.querySelector('[data-layer=provider]');
                const a=brand.getBoundingClientRect();
                const conflicts=['menu','sound','help'].filter(id=>{
                  const b=document.getElementById(id).getBoundingClientRect();
                  return Math.min(a.right,b.right)>Math.max(a.left,b.left)&&Math.min(a.bottom,b.bottom)>Math.max(a.top,b.top);
                });
                return {conflicts,overflow:brand.scrollWidth-brand.clientWidth};
              });
              assert.deepEqual(r.conflicts,[]);assert(r.overflow<=1);
              await p.close();
            }
            console.log('PASS footer signature does not overlap controls at all four widths');
          } finally {await b.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legend-raster-polished-evidence
          path: qa-artifacts/raster-v2/
          retention-days: 14
