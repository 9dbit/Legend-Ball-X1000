name: Approved raster reference intake
on:
  push:
    branches: [fix/raster-artwork-20261112]
    paths: [.github/workflows/raster-source-intake.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Import original approved artwork with SHA-256 verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p design/references
          curl -fL --retry 2 --max-time 60 -o design/references/approved-celestial-concept.png 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IjqYUczuG9elCX3y0j3snqLYXf/824b13c9-d7ee-4957-9e56-b3534f59d609.png'
          echo '53a1573585a62546b4bfec821c7642697845f395ca017b9eb3f62941356b3ea9  design/references/approved-celestial-concept.png' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/references/approved-celestial-concept.png
          if ! git diff --cached --quiet; then
            git commit -m 'art: preserve exact approved PNG reference for raster restoration'
            git push origin HEAD:fix/raster-artwork-20261112
          fi
          git archive --format=zip HEAD -o /tmp/legend-raster-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: legend-raster-source
          path: /tmp/legend-raster-source.zip
          retention-days: 7
