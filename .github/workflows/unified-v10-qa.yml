name: Legend unified layout and Universal Studio QA
on:
  push:
    branches: [feat/unified-assets-layout-v10]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install Pillow
      - run: npm install --no-save --package-lock=false playwright@1.65.0
      - run: npx playwright install --with-deps chromium chrome webkit
      - run: |
          set -euo pipefail
          PORT=3118 node server.mjs > /tmp/legend-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:3118/health && break; sleep 1; done
          export LEGEND_URL=http://127.0.0.1:3118
          export LEGEND_CAPTURE_SCREENSHOTS=1
          node scripts/tests/unified-v10-browser.mjs
          node scripts/tests/legend-layered-splash-browser.mjs
          python3 scripts/tests/check-splash-fidelity.py
          node scripts/tests/legend-splash-motion-browser.mjs
          node scripts/tests/legend-safe-area-browser.mjs
          node scripts/tests/legend-menu-v13-browser.mjs
        env:
          # The visible WebGL canvas uses a transparent inline decoder. WebKitGTK's
          # offscreen-media suspension is Linux-specific; WebKit's own GLib
          # test driver enables this setting for equivalent media tests.
          WEBKIT_GST_ALLOW_PLAYBACK_OF_INVISIBLE_VIDEOS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legend-unified-v12-browser-evidence
          path: |
            qa-artifacts/unified-v12/
            qa-artifacts/legend-layered-splash/
            qa-artifacts/legend-splash-motion/
            qa-artifacts/legend-safe-area/
            qa-artifacts/legend-menus-v13/
          retention-days: 14
