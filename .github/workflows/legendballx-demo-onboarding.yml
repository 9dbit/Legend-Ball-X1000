name: LegendBallX public-demo onboarding gate
on:
  push:
    branches: [security/legendballx-demo-production-20261124]
  pull_request:
    branches: [feat/unified-assets-layout-v10]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-and-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and production route security
        run: npm test
      - name: Validate demo service source
        run: |
          node --check server.mjs
          git diff --check
      - name: Browser engines
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install --with-deps chromium chrome webkit
      - name: QA splash, UI, lifecycle and safe areas
        env:
          LEGEND_CAPTURE_SCREENSHOTS: '1'
          LEGEND_URL: http://127.0.0.1:3118
          WEBKIT_GST_ALLOW_PLAYBACK_OF_INVISIBLE_VIDEOS: '1'
        run: |
          set -euo pipefail
          PORT=3118 NODE_ENV=production LEGEND_PUBLIC_DEMO=true LEGEND_PUBLIC_HOST=127.0.0.1 SKYGATE_STUDIO_REQUIRE_AUTH=true node server.mjs >/tmp/legendballx-demo.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3118/health && break
            sleep 1
          done
          curl -fsSI http://127.0.0.1:3118/play/
          node scripts/tests/legend-safe-area-browser.mjs
          node scripts/tests/legend-menu-v13-browser.mjs
          node scripts/tests/legend-splash-motion-browser.mjs
      - name: Studio-integration preview QA in isolated local development mode
        env:
          LEGEND_CAPTURE_SCREENSHOTS: '1'
          LEGEND_URL: http://127.0.0.1:3119
          WEBKIT_GST_ALLOW_PLAYBACK_OF_INVISIBLE_VIDEOS: '1'
        run: |
          set -euo pipefail
          PORT=3119 NODE_ENV=development LEGEND_PUBLIC_DEMO=false node server.mjs >/tmp/legendballx-studio-qa.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3119/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/tests/unified-v10-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legendballx-demo-onboarding
          path: |
            qa-artifacts/legend-safe-area/
            qa-artifacts/legend-menus-v13/
            qa-artifacts/legend-splash-motion/
            qa-artifacts/unified-v12/
          retention-days: 14
