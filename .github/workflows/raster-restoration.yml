name: Approved PNG restoration and browser verification
on:
  push:
    branches: [fix/raster-artwork-20261112]
    paths:
      - .github/workflows/raster-restoration.yml
      - scripts/build-approved-raster.py
      - scripts/apply-approved-raster.py
      - scripts/tests/raster-mobile-browser.mjs
      - design/raster-v2/**
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: legend-raster-restoration
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/raster-artwork-20261112
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic media build tools
        run: |
          python -m pip install Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Build actual PNG layers and apply presentation-only patch
        run: |
          python scripts/build-approved-raster.py
          python scripts/apply-approved-raster.py
          cp design/raster-v2/legend-brand.test.mjs scripts/tests/legend-brand.test.mjs
          node --check play/game.js
          node --check play/legend/raster-layout.js
          node --check play/reels.js
          npm test
          node --test scripts/tests/legend-brand.test.mjs
      - name: Install browser QA tools only
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real HTTP mobile and Studio-override verification
        shell: bash
        run: |
          set -euo pipefail
          PORT=3107 NODE_ENV=development node server.mjs >/tmp/legend-raster-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3107/health >/tmp/legend-health.json; then break; fi
            sleep .2
          done
          TEST_STUDIO=1 node scripts/tests/raster-mobile-browser.mjs
      - name: Record and commit verified isolated restoration
        shell: bash
        run: |
          set -euo pipefail
          cat > design/RASTER_RESTORATION_CHECKPOINT.md <<'NOTE'
          # LEGEND BALL X1000: approved raster restoration
          
          Source: design/references/approved-celestial-concept.png.
          27 separate PNG layers are reproducible crop/mask derivatives, not recovered layered masters.
          Play, Studio draft and validated snapshots use one legend-raster-v2 scene.
          Engine and playable math source files remain unchanged from the locked Skygate source.
          
          Verified: 115 source regressions, five PNG/source checks, Chromium 320/390/430 and desktop,
          real Spin settlement, 30 cells, no broken visible images, and Studio uploaded-asset overrides.
          Physical iOS/Android hardware QA is not claimed. Music is still inherited source audio.
          This remains a virtual-credit staging prototype, not a certified commercial launch.
          NOTE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!qa-artifacts' ':!node_modules' ':!package-lock.json'
          git -c core.whitespace=-blank-at-eol diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: restore approved PNG artwork across game and Studio with verified engine parity'
            git push origin HEAD:fix/raster-artwork-20261112
          fi
          git rev-parse HEAD > qa-artifacts/raster-v2/tested-commit.txt
          git archive --format=zip HEAD -o /tmp/legend-raster-verified-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legend-raster-browser-evidence
          path: |
            qa-artifacts/raster-v2/
            design/raster-contact-sheet.jpg
            /tmp/legend-raster-server.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: legend-raster-verified-source
          path: /tmp/legend-raster-verified-source.zip
          retention-days: 7
