name: LEGEND BALL V5 approved UI live staging acceptance
on:
  push:
    branches: [feat/approved-master-ui-v5-20261113]
    paths:
      - '.github/workflows/legend-approved-master-v5-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d69766884846e86a8c95d1478df257c2fd88a8a
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm correct live deployed version and private Studio
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://legend-ball-web-staging.up.railway.app'
          for i in $(seq 1 60); do
            if curl -fsS --max-time 8 "$BASE/health" >/tmp/legend-v5-health.json; then break; fi
            sleep 2
          done
          cat /tmp/legend-v5-health.json
          curl -fLsS -o /tmp/legend-v5-index.html "$BASE/play/?master=v5"
          grep -q 'approved-master-v5.css?v=locked-1' /tmp/legend-v5-index.html
          curl -fLsS -o /tmp/legend-master-v5.css "$BASE/play/legend/approved-master-v5.css?v=locked-1"
          grep -q 'splash-master.jpg' /tmp/legend-master-v5.css
          curl -fLsS -o /tmp/legend-v5-splash.jpg "$BASE/play/assets/legend-master/splash-master.jpg"
          curl -fLsS -o /tmp/legend-v5-backdrop.webp "$BASE/play/assets/legend-master/gameplay-backdrop.webp"
          curl -fLsS -o /tmp/legend-v5-frame.png "$BASE/play/assets/legend-master/reel-frame.png"
          python3 - <<'PY'
          import hashlib,pathlib
          expected='36506b8ec5a8f51dab0ceb6b94a95d6cb44ae6131941ce1cfa869c2b0eab46c6'
          b=pathlib.Path('/tmp/legend-v5-splash.jpg').read_bytes()
          assert hashlib.sha256(b).hexdigest()==expected, 'deployed splash differs from user-approved screenshot'
          assert pathlib.Path('/tmp/legend-v5-backdrop.webp').read_bytes()[8:12]==b'WEBP'
          assert pathlib.Path('/tmp/legend-v5-frame.png').read_bytes()[:8]==bytes([137,80,78,71,13,10,26,10])
          print('PASS: deployed exact approved splash SHA and gameplay assets')
          PY
          code=$(curl -sS -o /tmp/legend-v5-editor.txt -w '%{http_code}' --max-time 15 "$BASE/studio/")
          if test "$code" != '401' && test "$code" != '503'; then
            echo "Studio not fail-closed (HTTP $code)";exit 1
          fi
          echo "PASS: private Studio remains closed (HTTP $code)"
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test real iPhone viewport, exact splash artwork and gameplay payout
        run: LEGEND_URL=https://legend-ball-web-staging.up.railway.app/play/?master=v5 node scripts/tests/approved-master-v5-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legend-v5-live-locked-master-proof
          path: qa-artifacts/approved-v5/
          if-no-files-found: ignore
          retention-days: 14
